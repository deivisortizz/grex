version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: grex_backend
    restart: unless-stopped
    ports:
      - "8765:8765"
    volumes:
      - grex_data:/app/data

  frontend:
    build:
      context: ./arb-desk
      dockerfile: Dockerfile.frontend
      args:
        - VITE_WS_URL=ws://localhost:8765
    container_name: grex_frontend
    restart: unless-stopped
    ports:
      - "3001:80"
    depends_on:
      - backend

volumes:
  grex_data:
