services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: grex_backend
    restart: unless-stopped
    ports:
      - "8765:8765"
      - "8766:8766"
      - "8767:8767"
      - "8768:8768" # Copy Sniper (copy_sniper.py) — faltava, causava o WS falhar externamente
      - "3001:3000" # <--- Alterado de 3000:3000 para 3001:3000
    volumes:
      - grex_data:/app/data

  frontend:
    build:
      context: ./arb-desk
      dockerfile: Dockerfile.frontend
      args:
        - VITE_WS_URL=ws://localhost:8765
    container_name: grex_frontend
    restart: unless-stopped
    ports:
      - "3002:80" # <--- Opcional, alterado para evitar conflito se necessário
    depends_on:
      - backend

volumes:
  grex_data:
